name: Build and Release Karigar Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/karigar-mobile.apk
          ls -la build-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: karigar-mobile-apk
          path: build-output/karigar-mobile.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "KARIGAR Mobile v1.0.0 (Android APK)"
          body: |
            ## 📱 KARIGAR Mobile App - Android APK Release

            Welcome to the official **KARIGAR Mobile App** for Indian artisans and craft patrons!

            ### ✨ Highlights & Capabilities
            - 🏺 **Authentic Craft Catalog**: Explore GI-tagged traditional Indian crafts and generational artisans.
            - 🧠 **Saathi AI Copilot**: Powered by Google Gemini 2.5 Flash for artisan storytelling, fair living wage calculation, and appraisal.
            - 🎙️ **Multi-Dialect Voice Support**: Native speech recognition in English, Hindi, Bengali, and Telugu.
            - 📸 **Direct Camera Craft Cataloging**: Upload artisan crafts directly from your smartphone camera.
            - ⚡ **Native Performance**: Hardware acceleration and offline cultural heritage fallback.

            ### 📥 Installation Instructions
            1. Tap **`karigar-mobile.apk`** below to download directly to your Android device.
            2. When opened, permit installation from your browser or file manager ("Install Unknown Apps").
            3. Launch **KARIGAR** to access the marketplace and Saathi AI copilot!
          files: build-output/karigar-mobile.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

